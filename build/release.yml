# Builds the Pulse Chat installers and publishes them as a GitHub release (see BUILDING.md).
# Starts by itself when a change reaches main with a new version number in app-src/package.json (one that has no
# release yet): it builds both installers and publishes release v<version>. Also starts when a release is published by
# hand (Releases → Draft a new release, tag like v1.6.1), and from the Actions tab (Run workflow: builds only).
name: Release
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(node -p "require('./app-src/package.json').version")"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION is already released: nothing to build (raise the version in app-src/package.json to release)"
              echo "build=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --universal
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Build the installer
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          echo "Building Pulse Chat $VERSION for $GITHUB_REPOSITORY"
          node build/prepare.js
          npx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="$VERSION" -c.extraMetadata.pulseRepo="$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
  release:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pulse Chat ${{ needs.check.outputs.version }}
          files: out/*
          append_body: true
          body: |
            **Mac:** download the .dmg, open it and drag Pulse Chat to Applications. The first time, macOS says it can't check the app: open **System Settings → Privacy & Security**, scroll down and press **Open Anyway** (once).
            **Windows:** download the Setup .exe and run it. If Windows says it protected your PC, press **More info → Run anyway** (once).
            Already have Pulse Chat? Quit it and install this over it: your clips, transcripts and settings stay.
